apiVersion: batch/v1
kind: Job
metadata:
  name: __JOB_NAME__
  namespace: __APP_NS__
spec:
  backoffLimit: 0
  ttlSecondsAfterFinished: 3600
  template:
    metadata:
      labels:
        app: k6
        benchmark-role: load-generator
      annotations:
        sidecar.istio.io/nativeSidecar: "true"
    spec:
      serviceAccountName: benchmark-client
      restartPolicy: Never
      nodeSelector:
        benchmark-role: load-generator
      tolerations:
        - key: dedicated
          operator: Equal
          value: load-generator
          effect: NoSchedule
      containers:
        - name: k6
          image: grafana/k6:0.53.0
          imagePullPolicy: IfNotPresent
          command:
            - sh
            - -c
            - |
              set -u
              echo "k6 container is ready; waiting for benchmark start signal"
              while [ ! -f /results/.start ]; do
                sleep 0.1
              done
              echo "benchmark start signal received"
              set +e
              k6 run "/scripts/__K6_SCRIPT__"
              code=$?
              set -e
              if [ -s /results/summary.json ]; then
                echo "k6 summary is ready"
              else
                echo "WARNING: k6 summary.json is missing or empty"
              fi
              echo "k6 finished with code ${code}; waiting for result collection"
              touch /results/.k6-finished
              i=0
              while [ ! -f /results/.copied ] && [ "$i" -lt 900 ]; do
                i=$((i + 1))
                sleep 1
              done
              exit "$code"
          env:
            - name: MODEL
              value: "__MODEL__"
            - name: TARGET_URL
              value: "__TARGET_URL__"
            - name: VUS
              value: "__VUS__"
            - name: MAX_VUS
              value: "__MAX_VUS__"
            - name: DURATION
              value: "__DURATION__"
            - name: RPS
              value: "__RPS__"
            - name: PAYLOAD_SIZE
              value: "__PAYLOAD_SIZE__"
            - name: RESPONSE_SIZE
              value: "__RESPONSE_SIZE__"
            - name: REQUEST_METHOD
              value: "__REQUEST_METHOD__"
            - name: REQUEST_PATH
              value: "__REQUEST_PATH__"
            - name: TEST_MODE
              value: "__TEST_MODE__"
            - name: NO_CONNECTION_REUSE
              value: "__NO_CONNECTION_REUSE__"
            - name: SERVER_DELAY_MS
              value: "__SERVER_DELAY_MS__"
            - name: REQUEST_TIMEOUT
              value: "__REQUEST_TIMEOUT__"
            - name: SLEEP_MS
              value: "__SLEEP_MS__"
            - name: FAIL_RATE_THRESHOLD
              value: "__FAIL_RATE_THRESHOLD__"
            - name: P95_THRESHOLD_MS
              value: "__P95_THRESHOLD_MS__"
            - name: SUCCESS_RATE_THRESHOLD
              value: "__SUCCESS_RATE_THRESHOLD__"
          resources:
            requests:
              cpu: "1"
              memory: 256Mi
            limits:
              cpu: "8"
              memory: 2Gi
          volumeMounts:
            - name: k6-scripts
              mountPath: /scripts
              readOnly: true
            - name: results
              mountPath: /results
      volumes:
        - name: k6-scripts
          configMap:
            name: k6-scripts
        - name: results
          emptyDir: {}
