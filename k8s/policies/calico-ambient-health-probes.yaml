apiVersion: projectcalico.org/v3
kind: NetworkPolicy
metadata:
  name: server-allow-ambient-health-probes
  namespace: __APP_NS__
spec:
  selector: app == 'server'
  types:
    - Ingress
  ingress:
    - action: Allow
      protocol: TCP
      source:
        nets:
          - 169.254.7.127/32
      destination:
        ports:
          - 8080
