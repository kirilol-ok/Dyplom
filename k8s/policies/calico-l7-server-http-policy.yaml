apiVersion: projectcalico.org/v3
kind: NetworkPolicy
metadata:
  name: server-l7-http
spec:
  selector: app == 'server'
  types:
    - Ingress
    - Egress
  ingress:
    - action: Allow
      protocol: TCP
      source:
        selector: app == 'k6'
        serviceAccounts:
          names:
            - benchmark-client
      destination:
        ports:
          - 8080
      http:
        methods:
          - GET
        paths:
          - exact: /health
          - prefix: /api
  egress:
    - action: Allow
