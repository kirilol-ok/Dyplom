apiVersion: projectcalico.org/v3
kind: NetworkPolicy
metadata:
  name: server-l7-http-allow
  namespace: __APP_NS__
spec:
  selector: app == 'server'
  types:
    - Ingress
    - Egress
  ingress:
    - action: Allow
      protocol: TCP
      source:
        selector: (app == 'client') || (benchmark-role == 'load-generator')
      destination:
        ports:
          - 8080
      http:
        methods:
          - GET
        paths:
          - exact: /health
          - prefix: /api
          - prefix: /payload
          - prefix: /delay
  egress:
    - action: Allow
