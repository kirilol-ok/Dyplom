apiVersion: v1
kind: ConfigMap
metadata:
  name: app-code
data:
  server.py: |
    import json
    import os
    import time
    from http.server import BaseHTTPRequestHandler, HTTPServer
    from urllib.parse import urlparse, parse_qs

    PORT = int(os.environ.get("PORT", "8080"))

    def body_bytes(size: int) -> bytes:
        if size <= 0:
            return b""
        payload = "x" * size
        return payload.encode("utf-8")

    class Handler(BaseHTTPRequestHandler):
        server_version = "diploma-server/1.0"

        def log_message(self, fmt, *args):
            print("server", self.address_string(), fmt % args, flush=True)

        def _send(self, status: int, payload: dict, response_size: int = 0, started: float | None = None):
            if response_size > 0:
                payload["data"] = "x" * response_size
            raw = json.dumps(payload).encode("utf-8")
            elapsed_ms = 0.0 if started is None else (time.time() - started) * 1000.0
            self.send_response(status)
            self.send_header("Content-Type", "application/json")
            self.send_header("Content-Length", str(len(raw)))
            self.send_header("X-Upstream-Latency-Ms", f"{elapsed_ms:.3f}")
            self.end_headers()
            self.wfile.write(raw)

        def _handle(self):
            started = time.time()
            parsed = urlparse(self.path)
            qs = parse_qs(parsed.query)
            response_size = int(qs.get("response_size", ["0"])[0] or "0")

            if parsed.path == "/health":
                self._send(200, {"status": "ok"}, response_size, started)
                return

            if parsed.path.startswith("/delay/"):
                try:
                    delay_ms = int(parsed.path.rsplit("/", 1)[-1])
                except ValueError:
                    delay_ms = 0
                time.sleep(max(delay_ms, 0) / 1000.0)
                self._send(200, {"status": "delayed", "delay_ms": delay_ms}, response_size, started)
                return

            if parsed.path.startswith("/payload"):
                self._send(200, {"status": "payload", "method": self.command}, response_size, started)
                return

            if parsed.path.startswith("/api"):
                length = int(self.headers.get("Content-Length", "0") or "0")
                if length:
                    self.rfile.read(length)
                self._send(200, {"status": "api", "method": self.command, "path": parsed.path}, response_size, started)
                return

            if parsed.path.startswith("/admin"):
                self._send(200, {"status": "admin", "method": self.command}, response_size, started)
                return

            self._send(404, {"status": "not_found", "path": parsed.path}, response_size, started)

        def do_GET(self):
            self._handle()

        def do_POST(self):
            self._handle()

        def do_PUT(self):
            self._handle()

        def do_DELETE(self):
            self._handle()

    if __name__ == "__main__":
        print(f"server listening on {PORT}", flush=True)
        HTTPServer(("0.0.0.0", PORT), Handler).serve_forever()

  client.py: |
    import json
    import os
    import time
    import urllib.error
    import urllib.parse
    import urllib.request
    from http.server import BaseHTTPRequestHandler, HTTPServer
    from urllib.parse import urlparse, parse_qs

    PORT = int(os.environ.get("PORT", "8080"))
    SERVER_URL = os.environ.get("SERVER_URL", "http://server:8080")

    def make_payload(size: int) -> bytes:
        return ("x" * max(size, 0)).encode("utf-8")

    class Handler(BaseHTTPRequestHandler):
        server_version = "diploma-client/1.0"

        def log_message(self, fmt, *args):
            print("client", self.address_string(), fmt % args, flush=True)

        def do_GET(self):
            self._handle()

        def do_POST(self):
            self._handle()

        def _handle(self):
            parsed = urlparse(self.path)
            if parsed.path != "/proxy":
                self._send_json(404, {"status": "not_found"}, 0.0)
                return

            qs = parse_qs(parsed.query)
            target_path = qs.get("path", ["/api/data"])[0]
            method = qs.get("method", ["GET"])[0].upper()
            payload_size = int(qs.get("payload_size", ["0"])[0] or "0")
            response_size = int(qs.get("response_size", ["0"])[0] or "0")
            server_delay_ms = int(qs.get("server_delay_ms", ["0"])[0] or "0")
            timeout_s = float(qs.get("timeout_s", ["5"])[0] or "5")

            path_query = urllib.parse.urlencode({"response_size": response_size})
            path = target_path
            if server_delay_ms > 0 and target_path == "/api/data":
                path = f"/delay/{server_delay_ms}"
            separator = "&" if "?" in path else "?"
            url = f"{SERVER_URL}{path}{separator}{path_query}"

            data = make_payload(payload_size) if method not in ("GET", "DELETE") else None
            request = urllib.request.Request(url=url, data=data, method=method)
            request.add_header("Content-Type", "application/octet-stream")

            started = time.time()
            try:
                with urllib.request.urlopen(request, timeout=timeout_s) as response:
                    raw = response.read()
                    status = response.status
                    upstream_header = response.headers.get("X-Upstream-Latency-Ms", "")
            except urllib.error.HTTPError as exc:
                raw = exc.read()
                status = exc.code
                upstream_header = exc.headers.get("X-Upstream-Latency-Ms", "")
            except Exception as exc:
                elapsed_ms = (time.time() - started) * 1000.0
                self._send_json(502, {"status": "proxy_error", "error": str(exc)}, elapsed_ms)
                return

            elapsed_ms = (time.time() - started) * 1000.0
            try:
                upstream_payload = json.loads(raw.decode("utf-8")) if raw else {}
            except Exception:
                upstream_payload = {"raw": raw.decode("utf-8", errors="replace")}

            body = {
                "status": "proxied",
                "backend_status": status,
                "target": url,
                "method": method,
                "upstream_latency_header_ms": upstream_header,
                "client_measured_upstream_ms": round(elapsed_ms, 3),
                "upstream_payload": upstream_payload,
            }
            self._send_json(status, body, elapsed_ms)

        def _send_json(self, status: int, payload: dict, upstream_ms: float):
            raw = json.dumps(payload).encode("utf-8")
            self.send_response(status)
            self.send_header("Content-Type", "application/json")
            self.send_header("Content-Length", str(len(raw)))
            self.send_header("X-Upstream-Latency-Ms", f"{upstream_ms:.3f}")
            self.end_headers()
            self.wfile.write(raw)

    if __name__ == "__main__":
        print(f"client listening on {PORT}, server={SERVER_URL}", flush=True)
        HTTPServer(("0.0.0.0", PORT), Handler).serve_forever()
